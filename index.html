<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dexora</title>
    <!-- The Poke Ball the game already ships, on a 32px canvas so it lands on
         the browser's own favicon grid without resampling. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/sprites/25.png" />
    <meta name="theme-color" content="#2f6b4c" />
    <meta name="color-scheme" content="light dark" />
    <!-- Night mode before the first paint - the same rule as src/ui/theme.js,
         which takes over once the bundle runs. -->
    <script>
      try {
        var t = localStorage.getItem("dexora-theme") || "auto";
        document.documentElement.dataset.theme = t === "dark" || (t === "auto"
          && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Catch, collect and evolve the whole National Dex across eleven hand-made maps."
    />
    <!-- The three faces are self-hosted and registered by main.jsx; fetched
         here, in parallel with the bundle, so the first paint has them. -->
    <link rel="preload" href="fonts/nunito-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/geist-pixel.woff2" as="font" type="font/woff2" crossorigin />
    <!-- THE MAP'S ART, in parallel with the bundle too: loadArt asked for it only
         once the script had run, and on a slow line the map drew 1.7s after
         the page (route.png, 368KB) - measured 2026-09-30. -->
    <link rel="preload" href="tilesets/route.png" as="image" />
    <link rel="preload" href="tilesets/route_top.png" as="image" />
    <link rel="preload" href="tilesets/player.png" as="image" />
    <link rel="preload" href="tilesets/grassfx.png" as="image" />
    <link rel="preload" href="tilesets/route.json" as="fetch" crossorigin />
    <link rel="preload" href="tilesets/player.json" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
